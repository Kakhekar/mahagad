      rel="stylesheet"
    />

      :root {
        --saffron: #ff6b1a;
        --deep-saffron: #c94f00;
        --gold: #d4a017;
        --dark: #1a0f00;
        --parchment: #f5ecd7;
        --stone: #8b7355;
        --checked-bg: #2d4a1e;
        --checked-text: #a8d878;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: var(--dark);
        font-family: "Tiro Devanagari Marathi", serif;
        min-height: 100vh;
        background-image:
          radial-gradient(ellipse at 20% 0%, #3d1a00 0%, transparent 50%),
          radial-gradient(ellipse at 80% 100%, #1a2d00 0%, transparent 50%);
      }
      .page-wrapper {
        max-width: 960px;
        margin: 0 auto;
        padding: 20px 14px 60px;
      }
      header {
        text-align: center;
        padding: 32px 20px 20px;
      }
      .emblem {
        font-size: 42px;
        display: block;
        margin-bottom: 10px;
        filter: drop-shadow(0 0 20px rgba(255, 107, 26, 0.6));
        animation: glow 3s ease-in-out infinite;
      }
      @keyframes glow {
        0%,
        100% {
          filter: drop-shadow(0 0 20px rgba(255, 107, 26, 0.6));
        }
        50% {
          filter: drop-shadow(0 0 35px rgba(255, 107, 26, 0.9));
        }
      }
      h1 {
        font-size: clamp(20px, 5vw, 36px);
        color: var(--saffron);
        letter-spacing: 2px;
        text-shadow: 0 2px 20px rgba(255, 107, 26, 0.4);
        line-height: 1.3;
      }
      .subtitle {
        font-family: "Libre Baskerville", serif;
        font-style: italic;
        color: var(--gold);
        font-size: 12px;
        margin-top: 6px;
        opacity: 0.8;
      }
      .divider {
        width: 200px;
        height: 2px;
        background: linear-gradient(
          90deg,
          transparent,
          var(--saffron),
          transparent
        );
        margin: 16px auto;
      }
      .stats-bar {
        display: flex;
        justify-content: center;
        gap: 24px;
        padding: 12px 18px;
        background: rgba(255, 107, 26, 0.08);
        border: 1px solid rgba(255, 107, 26, 0.2);
        border-radius: 8px;
        margin-bottom: 18px;
        flex-wrap: wrap;
      }
      .stat {
        text-align: center;
      }
      .stat-num {
        font-size: 24px;
        font-weight: 700;
        color: var(--saffron);
        display: block;
        font-family: "Libre Baskerville", serif;
        text-shadow: 0 0 10px rgba(255, 107, 26, 0.5);
      }
      .stat-label {
        font-size: 10px;
        color: var(--stone);
        text-transform: uppercase;
        letter-spacing: 1px;
        font-family: "Libre Baskerville", serif;
      }
      .progress-container {
        margin-bottom: 18px;
      }
      .progress-bar-bg {
        height: 7px;
        background: rgba(255, 255, 255, 0.07);
        border-radius: 4px;
        overflow: hidden;
      }
      .progress-bar-fill {
        height: 100%;
        background: linear-gradient(
          90deg,
          var(--deep-saffron),
          var(--saffron),
          var(--gold)
        );
        border-radius: 4px;
        transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: 0 0 10px rgba(255, 107, 26, 0.5);
      }
      .progress-text {
        text-align: right;
        font-size: 11px;
        color: var(--stone);
        margin-top: 4px;
        font-family: "Libre Baskerville", serif;
      }
      .controls {
        display: flex;
        gap: 8px;
        margin-bottom: 14px;
        flex-wrap: wrap;
      }
      .search-box {
        flex: 1;
        min-width: 150px;
        padding: 8px 12px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 107, 26, 0.2);
        border-radius: 6px;
        color: var(--parchment);
        font-size: 14px;
        font-family: "Tiro Devanagari Marathi", serif;
        outline: none;
        transition: border-color 0.2s;
      }
      .search-box::placeholder {
        color: var(--stone);
        opacity: 0.6;
      }
      .search-box:focus {
        border-color: var(--saffron);
      }
      .btn {
        padding: 7px 13px;
        border: 1px solid rgba(255, 107, 26, 0.3);
        background: rgba(255, 107, 26, 0.08);
        color: var(--saffron);
        border-radius: 6px;
        cursor: pointer;
        font-size: 12px;
        font-family: "Tiro Devanagari Marathi", serif;
        transition: all 0.2s;
      }
      .btn:hover {
        background: rgba(255, 107, 26, 0.18);
        border-color: var(--saffron);
      }
      .btn-danger {
        border-color: rgba(180, 60, 60, 0.3);
        background: rgba(180, 60, 60, 0.06);
        color: #e07070;
      }
      .btn-danger:hover {
        background: rgba(180, 60, 60, 0.15);
        border-color: #e07070;
      }

      /* District filter pills */
      .dist-filter {
        display: flex;
        gap: 6px;
        margin-bottom: 16px;
        flex-wrap: wrap;
        align-items: center;
      }
      .dist-label {
        font-size: 11px;
        color: var(--stone);
        font-family: "Libre Baskerville", serif;
        flex-shrink: 0;
      }
      .dist-btn {
        padding: 4px 11px;
        border: 1px solid rgba(255, 107, 26, 0.2);
        background: transparent;
        color: var(--stone);
        border-radius: 20px;
        cursor: pointer;
        font-size: 11px;
        font-family: "Tiro Devanagari Marathi", serif;
        transition: all 0.2s;
        white-space: nowrap;
      }
      .dist-btn.active {
        background: rgba(255, 107, 26, 0.15);
        border-color: var(--saffron);
        color: var(--saffron);
      }

      /* District section header */
      .section-header {
        padding: 9px 14px;
        background: rgba(255, 107, 26, 0.1);
        border-left: 3px solid var(--saffron);
        margin: 20px 0 8px;
        border-radius: 0 6px 6px 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        cursor: pointer;
        user-select: none;
      }
      .section-header:hover {
        background: rgba(255, 107, 26, 0.15);
      }
      .section-title {
        color: var(--saffron);
        font-size: 13px;
        font-family: "Libre Baskerville", serif;
        font-weight: 700;
      }
      .section-meta {
        color: var(--stone);
        font-size: 11px;
        font-family: "Libre Baskerville", serif;
        font-style: italic;
        display: flex;
        gap: 12px;
        align-items: center;
      }
      .section-progress {
        font-size: 10px;
        color: var(--gold);
      }
      .collapse-icon {
        color: var(--stone);
        font-size: 12px;
        transition: transform 0.2s;
        margin-left: 8px;
      }
      .section-header.collapsed .collapse-icon {
        transform: rotate(-90deg);
      }

      .fort-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(195px, 1fr));
        gap: 7px;
        margin-bottom: 4px;
      }
      .fort-grid.collapsed-grid {
        display: none;
      }

      .fort-item {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 9px 11px;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 107, 26, 0.1);
        border-radius: 7px;
        cursor: pointer;
        transition: all 0.2s ease;
        user-select: none;
      }
      .fort-item:hover {
        border-color: rgba(255, 107, 26, 0.35);
        background: rgba(255, 107, 26, 0.06);
        transform: translateY(-1px);
        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.3);
      }
      .fort-item.checked {
        background: rgba(45, 74, 30, 0.35);
        border-color: rgba(100, 180, 60, 0.35);
      }
      .fort-item.checked .fort-name {
        color: var(--checked-text);
        text-decoration: line-through;
        text-decoration-color: rgba(168, 216, 120, 0.5);
      }
      .fort-item.hidden {
        display: none;
      }
      .checkbox {
        width: 17px;
        height: 17px;
        border: 2px solid rgba(255, 107, 26, 0.4);
        border-radius: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        transition: all 0.2s;
        background: rgba(0, 0, 0, 0.2);
      }
      .fort-item.checked .checkbox {
        background: var(--checked-bg);
        border-color: #64b43c;
      }
      .checkmark {
        color: #64b43c;
        font-size: 10px;
        opacity: 0;
        transform: scale(0.5);
        transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      .fort-item.checked .checkmark {
        opacity: 1;
        transform: scale(1);
      }
      .fort-info {
        flex: 1;
        min-width: 0;
      }
      .fort-name {
        font-size: 13px;
        color: var(--parchment);
        transition: color 0.2s;
        line-height: 1.3;
      }
      .fort-dist {
        font-size: 9px;
        color: var(--stone);
        font-family: "Libre Baskerville", serif;
        margin-top: 2px;
      }
      .fort-num {
        font-size: 9px;
        color: var(--stone);
        font-family: "Libre Baskerville", serif;
        min-width: 18px;
        flex-shrink: 0;
        opacity: 0.55;
      }
      .no-results {
        text-align: center;
        color: var(--stone);
        padding: 40px;
        font-style: italic;
        display: none;
      }
      footer {
        text-align: center;
        margin-top: 40px;
        color: var(--stone);
        font-size: 11px;
        font-family: "Libre Baskerville", serif;
        opacity: 0.6;
        font-style: italic;
      }
      @media (max-width: 480px) {
        .fort-grid {
          grid-template-columns: 1fr 1fr;
        }
      }
    </style>
  </head>

        </p>
        <div class="divider"></div>
      </header>

        </div>
        <div class="stat">
          <span class="stat-num" id="total-count">0</span
          ><span class="stat-label">एकूण किल्ले</span>
        </div>
        <div class="stat">
          <span class="stat-num" id="remaining-count">0</span
          ><span class="stat-label">बाकी आहे</span>
        </div>
        <div class="stat">
          <span class="stat-num" id="percent">0%</span
          ><span class="stat-label">पूर्ण झाले</span>
        </div>
      </div>

      <div class="progress-container">
        <div class="progress-bar-bg">
          <div
            class="progress-bar-fill"
            id="progress-fill"
            style="width: 0%"
          ></div>
        </div>
        <div class="progress-text" id="progress-text">0 / 0 किल्ले</div>
      </div>

      <div class="controls">
        <input
          class="search-box"
          type="text"
          id="search"
          placeholder="किल्ला शोधा..."
        />
        <button class="btn" onclick="checkAll()">सर्व चेक करा</button>
        <button class="btn btn-danger" onclick="clearAll()">
          सर्व साफ करा
        </button>
      </div>

      <div class="dist-filter">
        <span class="dist-label">जिल्हा:</span>
        <button class="dist-btn active" onclick="filterDistrict('all', this)">
          सर्व
        </button>
      </div>

      <div id="fort-sections"></div>
      <div class="no-results" id="no-results">कोणताही किल्ला सापडला नाही</div>
      <footer>जय महाराष्ट्र · जय शिवाजी महाराज 🏔</footer>
    </div>

        "सातारा",
        "अहिल्यानगर",

        "नाशिक",
        "कोल्हापूर",

        "नांदेड",

        पालघर: "🟣",
        सातारा: "🟡",
        अहिल्यानगर: "🔴",
        रत्नागिरी: "🌊",
        नाशिक: "🟢",
        कोल्हापूर: "⚪",
        "छत्रपती संभाजीनगर": "🏛",
        धुळे: "🟫",
        जळगाव: "🟨",
        सिंधुदुर्ग: "🌴",
        धाराशिव: "⬛",
        बीड: "🔶",
        नांदेड: "🔷",

        गडचिरोली: "🌳",
      };

      const grouped = {};
      districtOrder.forEach((d) => {
        grouped[d] = [];
      });
      forts.forEach((f) => {
        if (grouped[f.r]) grouped[f.r].push(f);
      });
      Object.keys(grouped).forEach((d) => grouped[d].sort((a, b) => a.d - b.d));

      let checked = [];
      try {
        checked = JSON.parse(localStorage.getItem("mh-forts-v4") || "[]");
      } catch (e) {}
      function saveState() {
        try {
          localStorage.setItem("mh-forts-v4", JSON.stringify(checked));
        } catch (e) {}
      }

      function updateStats() {
        const c = checked.length,
          total = forts.length;
        const pct = total ? Math.round((c / total) * 100) : 0;
        document.getElementById("visited-count").textContent = c;
        document.getElementById("total-count").textContent = total;
        document.getElementById("remaining-count").textContent = total - c;
        document.getElementById("percent").textContent = pct + "%";
        document.getElementById("progress-fill").style.width = pct + "%";
        document.getElementById("progress-text").textContent =
          `${c} / ${total} किल्ले`;
        // Update each section's progress label
        districtOrder.forEach((dist) => {
          const el = document.getElementById("prog-" + dist);
          if (!el) return;
          const sec = el.closest(".fort-section");
          const items = sec ? [...sec.querySelectorAll(".fort-item")] : [];
          const done = items.filter((i) =>
            i.classList.contains("checked"),
          ).length;
          el.textContent = `${done}/${items.length}`;
        });
      }

      let activeDistrict = "all",
        searchQ = "";

      function buildDistrictPills() {
        const bar = document.querySelector(".dist-filter");
        districtOrder.forEach((dist) => {
          if (!grouped[dist] || !grouped[dist].length) return;
          const btn = document.createElement("button");
          btn.className = "dist-btn";
          btn.textContent = dist;
          btn.onclick = () => filterDistrict(dist, btn);
          bar.appendChild(btn);
        });
      }

      function renderAll() {
        const container = document.getElementById("fort-sections");
        container.innerHTML = "";
        let globalNum = 0;
        districtOrder.forEach((dist) => {
          const df = grouped[dist];
          if (!df || !df.length) return;
          const avgDist = Math.round(
            df.reduce((s, f) => s + f.d, 0) / df.length,
          );
          const emoji = districtEmoji[dist] || "🏔";
          const sec = document.createElement("div");
          sec.className = "fort-section";
          sec.dataset.district = dist;
          const hdr = document.createElement("div");
          hdr.className = "section-header";
          hdr.innerHTML = `<div class="section-title">${emoji} ${dist} जिल्हा</div>
      <div class="section-meta">
        <span>~${avgDist} km · ${df.length} किल्ले</span>
        <span class="section-progress" id="prog-${dist}">0/${df.length}</span>
        <span class="collapse-icon">▼</span>
      </div>`;
          hdr.addEventListener("click", () => {
            hdr.classList.toggle("collapsed");
            grid.classList.toggle("collapsed-grid");
          });
          sec.appendChild(hdr);
          const grid = document.createElement("div");
          grid.className = "fort-grid";
          df.forEach((fort) => {
            const gi = forts.indexOf(fort);
            globalNum++;
            const isC = checked.includes(gi);
            const item = document.createElement("div");
            item.className = "fort-item" + (isC ? " checked" : "");
            item.dataset.index = gi;
            item.dataset.name = fort.n;
            item.dataset.district = dist;
            item.innerHTML = `<span class="fort-num">${globalNum}</span><div class="checkbox"><span class="checkmark">✓</span></div><div class="fort-info"><div class="fort-name">${fort.n}</div><div class="fort-dist">~${fort.d} km पुण्यापासून</div></div>`;
            item.addEventListener("click", () => {
              const pos = checked.indexOf(gi);
              if (pos === -1) checked.push(gi);
              else checked.splice(pos, 1);
              saveState();
              item.classList.toggle("checked");
              updateStats();
            });
            grid.appendChild(item);
          });
          sec.appendChild(grid);
          container.appendChild(sec);
        });
        applyFilters();
        updateStats();
      }

      function applyFilters() {
        let vis = 0;
        document.querySelectorAll(".fort-item").forEach((el) => {
          const matchS = !searchQ || el.dataset.name.includes(searchQ);
          const matchD =
            activeDistrict === "all" || el.dataset.district === activeDistrict;
          const show = matchS && matchD;
          el.classList.toggle("hidden", !show);
          if (show) vis++;
        });
        document.querySelectorAll(".fort-section").forEach((sec) => {
          const any = [...sec.querySelectorAll(".fort-item")].some(
            (e) => !e.classList.contains("hidden"),
          );
          sec.style.display = any ? "" : "none";
        });
        document.getElementById("no-results").style.display =
          vis === 0 ? "block" : "none";
      }

      function filterDistrict(val, btn) {
        activeDistrict = val;
        document
          .querySelectorAll(".dist-btn")
          .forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        applyFilters();
      }

      function checkAll() {
        checked = forts.map((_, i) => i);
        saveState();
        document
          .querySelectorAll(".fort-item")
          .forEach((el) => el.classList.add("checked"));
        updateStats();
      }
      function clearAll() {
        if (!confirm("सर्व चेकमार्क काढायचे?")) return;
        checked = [];
        saveState();
        document
          .querySelectorAll(".fort-item")
          .forEach((el) => el.classList.remove("checked"));
        updateStats();
      }
      document.getElementById("search").addEventListener("input", function () {
        searchQ = this.value.trim();
        applyFilters();
      });

      buildDistrictPills();
      renderAll();
    </script>
